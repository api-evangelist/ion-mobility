aid: ion-mobility
name: Ion Mobility
description: ION Mobility is a Singapore-headquartered technology and automotive company that
  designs and builds affordable, zero-emission smart electric motorcycles for riders across
  Southeast Asia, with its flagship M1-S model and a companion rider mobile app. The company
  combines advanced hardware and software with human-centred design, spanning electric two-wheelers
  and energy charging and storage solutions, with additional offices in Jakarta and Shenzhen and
  backing from investors including 500 Global. This API Evangelist profile tracks the company's
  public developer and identity surface; ION Mobility currently publishes no public developer API,
  SDKs, or OpenAPI specification, operating a consumer waitlist/test-ride site and an internal
  open-source tooling estate on GitHub.
